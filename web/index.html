<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Pastelería M&amp;G · Repostería artesanal horneada cada mañana y llevada hasta tu puerta.">
  <meta name="theme-color" content="#FBF8F6">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pastelería M&amp;G">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Tipografías del sistema de diseño (precarga para evitar parpadeo) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <title>Pastelería M&amp;G</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #FBF8F6;
      overscroll-behavior: none;
    }

    /* Pantalla de carga con la identidad de la marca. */
    #cargador {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background:
        radial-gradient(60% 45% at 85% 0%, #F7E5E9 0%, rgba(247, 229, 233, 0) 70%),
        radial-gradient(55% 40% at 0% 55%, #F6EDDD 0%, rgba(246, 237, 221, 0) 70%),
        radial-gradient(65% 50% at 90% 100%, #E5EFE9 0%, rgba(229, 239, 233, 0) 70%),
        #FBF8F6;
      z-index: 9999;
      transition: opacity .5s ease;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    #cargador.oculto {
      opacity: 0;
      pointer-events: none;
    }

    .sello {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: linear-gradient(135deg, #D48B9C 0%, #BE6C82 100%);
      box-shadow: 0 12px 28px rgba(201, 123, 142, .32);
      border: 3px solid rgba(255, 255, 255, .85);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: respirar 2.4s ease-in-out infinite;
    }

    .sello svg { width: 36px; height: 36px; fill: #fff; }

    .marca {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 27px;
      font-weight: 600;
      letter-spacing: -.5px;
      color: #2E2A28;
      margin: 0;
    }

    .lema {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2.4px;
      color: #9A908A;
      margin: -14px 0 0;
    }

    @keyframes respirar {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.06); }
    }

    @media (prefers-reduced-motion: reduce) {
      .sello { animation: none; }
    }
  </style>
</head>
<body>
  <div id="cargador">
    <div class="sello">
      <!-- Ícono de tarta, mismo símbolo que usa la app -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2a1.5 1.5 0 0 1 1.5 1.5c0 .6-.4 1-.75 1.4-.3.35-.75.85-.75 1.6h-2c0-.75-.45-1.25-.75-1.6-.35-.4-.75-.8-.75-1.4A1.5 1.5 0 0 1 12 2Zm-5 6h10a3 3 0 0 1 3 3v1.2c-.7 0-1.1.35-1.55.72-.5.42-1.05.88-2.2.88s-1.7-.46-2.2-.88c-.45-.37-.85-.72-1.55-.72s-1.1.35-1.55.72c-.5.42-1.05.88-2.2.88s-1.7-.46-2.2-.88C6.1 12.55 5.7 12.2 5 12.2V11a3 3 0 0 1 3-3h-1Zm-3 7.1c1.15 0 1.7.46 2.2.88.45.37.85.72 1.55.72s1.1-.35 1.55-.72c.5-.42 1.05-.88 2.2-.88s1.7.46 2.2.88c.45.37.85.72 1.55.72s1.1-.35 1.55-.72c.45-.37.85-.72 1.55-.72V19a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-3.9Z"/>
      </svg>
    </div>
    <h1 class="marca">Pastelería M&amp;G</h1>
    <p class="lema">REPOSTERÍA ARTESANAL</p>
  </div>

  <script>
    // Retiramos la pantalla de carga en cuanto Flutter pinta su primer frame.
    window.addEventListener('flutter-first-frame', function () {
      var cargador = document.getElementById('cargador');
      if (!cargador) return;
      cargador.classList.add('oculto');
      setTimeout(function () { cargador.remove(); }, 600);
    });
  </script>

  <script>
    // `flutter_bootstrap.js` también quedó cacheado como "immutable" en
    // despliegues anteriores. Lo pedimos con una versión en la URL para que el
    // navegador se vea obligado a descargarlo de nuevo.
    (function () {
      var script = document.createElement('script');
      script.src = 'flutter_bootstrap.js?v=' + Date.now();
      script.async = true;
      document.body.appendChild(script);
    })();
  </script>

  <script>
    // Auto-actualización tras un despliegue.
    //
    // Las cabeceras `no-store` garantizan que una recarga traiga la versión
    // nueva, pero un teléfono con la app ya abierta seguiría ejecutando la
    // anterior hasta que el usuario recargue. Aquí comparamos la huella
    // (ETag / Last-Modified) de `main.dart.js` contra la que había al arrancar
    // y recargamos cuando cambia.
    (function () {
      var huellaInicial = null;
      var recargando = false;

      function leerHuella() {
        // El parámetro evita cualquier intermediario que ignore `no-store`.
        return fetch('main.dart.js?check=' + Date.now(), {
          method: 'HEAD',
          cache: 'no-store'
        }).then(function (respuesta) {
          if (!respuesta.ok) return null;
          return respuesta.headers.get('etag') ||
                 respuesta.headers.get('last-modified') ||
                 respuesta.headers.get('content-length');
        }).catch(function () {
          return null; // Sin conexión: lo reintentamos más tarde.
        });
      }

      function comprobar() {
        if (recargando || document.visibilityState !== 'visible') return;
        leerHuella().then(function (huella) {
          if (!huella) return;
          if (huellaInicial === null) {
            huellaInicial = huella;
            return;
          }
          if (huella !== huellaInicial) {
            recargando = true;
            window.location.reload();
          }
        });
      }

      window.addEventListener('flutter-first-frame', comprobar);
      // Al volver a la app: el momento natural para recargar sin interrumpir.
      document.addEventListener('visibilitychange', comprobar);
      // Y de forma periódica para sesiones largas dejadas abiertas.
      setInterval(comprobar, 5 * 60 * 1000);
    })();
  </script>
</body>
</html>
